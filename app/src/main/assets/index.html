<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Feng Files</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#182032}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#e5edff,#f8faff 48%,#d5e6f6)}body.dark{background:linear-gradient(140deg,#10182c,#222a3b);color:#f6f7ff}.app{max-width:520px;margin:auto;min-height:100vh;padding:55px 19px 115px}.top{display:flex;justify-content:space-between;align-items:center;color:#2479e8;font-size:16px}.round{border:1px solid #ffffffa0;background:#ffffff70;backdrop-filter:blur(25px);border-radius:50%;width:40px;height:40px;font-size:22px;color:inherit}.dark .round,.dark .glass{background:#ffffff17;border-color:#ffffff30}h1{font-size:35px;letter-spacing:-1.2px;margin:17px 0}.glass{background:#ffffffa8;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid #fff;border-radius:21px;box-shadow:0 9px 28px #647a9b14}.search{width:100%;border:0;background:transparent;padding:15px;font-size:16px;outline:0;color:inherit}.group{margin-top:25px}.group h3{font-size:19px;margin:0 0 12px}.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #8494ab22;cursor:pointer}.item:last-child{border:0}.ico{width:39px;height:39px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:#e8f1ff;color:#2379e9}.dark .ico{background:#344b69}.name{font-weight:600;font-size:15px}.sub{font-size:12px;opacity:.55;margin-top:3px}.chev{margin-left:auto;opacity:.35}.tabs{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(92%,490px);display:flex;padding:10px 8px;border-radius:29px;justify-content:space-around;z-index:5}.tab{border:0;background:transparent;color:#8491a5;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px}.tab span{font-size:23px}.tab.active{color:#147af5;font-weight:700}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.pill{border:1px solid #ffffffb0;background:#ffffff85;color:#2577db;border-radius:20px;padding:10px 13px;font-weight:600}.dark .pill{background:#ffffff1c;color:#8cbeff}.empty{opacity:.55;text-align:center;padding:35px 8px}.preview{position:fixed;inset:0;z-index:10;background:#f2f6ff;color:#192437;padding:45px 20px;overflow:auto}.dark .preview{background:#161d2c;color:white}.preview img,.preview video,.preview iframe{max-width:100%;width:100%;max-height:75vh;border:0;border-radius:15px;object-fit:contain}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none}button{cursor:pointer}#filepick{display:none}</style></head><body><div class="app"><div class="top"><span id="back" onclick="goBack()">‹ Browse</span><button class="round" onclick="toggleTheme()">◐</button></div><h1 id="heading">Browse</h1><div class="glass"><input id="search" class="search" placeholder="⌕  Search" oninput="render()"></div><div class="toolbar"><button class="pill" onclick="pick()">＋ Add Files</button><button class="pill" onclick="newFolder()">＋ Folder</button><button class="pill" onclick="toggleSort()">⇅ Sort</button></div><div id="content"></div></div><nav class="tabs glass"><button class="tab" id="recent" onclick="setTab('recent')"><span>◷</span>Recents</button><button class="tab active" id="browse" onclick="setTab('browse')"><span>▤</span>Browse</button><button class="tab" id="shared" onclick="setTab('shared')"><span>♧</span>Shared</button></nav><input id="filepick" type="file" multiple onchange="addFiles(this.files)"><div id="preview" class="preview hidden"></div><script>let tab='browse',folder='',sort=false;let entries=[],folders=['Downloads','Documents','Pictures','Movies','Music'];const $=x=>document.getElementById(x);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setTab(t){tab=t;folder='';render()}function toggleTheme(){document.body.classList.toggle('dark')}function toggleSort(){sort=!sort;render()}function pick(){$('filepick').click()}function addFiles(files){for(const f of files)entries.push({name:f.name,file:f,folder:folder||'Downloads',date:Date.now()});render()}function newFolder(){const n=prompt('New Folder');if(n&&n.trim()){folders.push(n.trim());render()}}function goBack(){if(!$('preview').classList.contains('hidden')){closePreview();return}folder='';tab='browse';render()}function fileIcon(n){return /\.(png|jpg|jpeg|webp|gif)$/i.test(n)?'▧':/\.(mp4|mov|webm)$/i.test(n)?'▶':/\.pdf$/i.test(n)?'▤':/\.(mp3|wav|ogg)$/i.test(n)?'♫':'▣'}function item(name,icon,sub,fn){let d=document.createElement('div');d.className='item';d.innerHTML='<div class="ico">'+icon+'</div><div><div class="name">'+esc(name)+'</div><div class="sub">'+esc(sub)+'</div></div><div class="chev">›</div>';d.onclick=fn;return d}function group(title){let wrap=document.createElement('section');wrap.className='group';let h=document.createElement('h3');h.textContent=title;wrap.append(h);let c=document.createElement('div');c.className='glass';wrap.append(c);$('content').append(wrap);return c}function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===tab));$('heading').textContent=folder||({browse:'Browse',recent:'Recents',shared:'Shared'}[tab]);$('back').textContent=folder?'‹ Browse':'‹ Files';$('content').innerHTML='';let q=$('search').value.toLowerCase();if(tab==='browse'&&!folder){let c=group('Locations');c.append(item('On My Android','📱','Local files',()=>{folder='Downloads';render()}));let f=group('Favorites');for(let n of folders.filter(n=>n.toLowerCase().includes(q)))f.append(item(n,'📁','Folder',()=>{folder=n;render()}))}let e=entries.filter(x=>(tab==='recent'||(tab==='browse'&&(!folder||x.folder===folder)))&&x.name.toLowerCase().includes(q));if(sort)e.sort((a,b)=>a.name.localeCompare(b.name));else e.sort((a,b)=>b.date-a.date);let c=group(tab==='recent'?'Recently Added':folder||'Files');for(let x of e)c.append(item(x.name,fileIcon(x.name),(x.file.size/1024).toFixed(1)+' KB · '+x.folder,()=>openFile(x)));if(!e.length)c.innerHTML='<div class="empty">'+(tab==='shared'?'No shared files':'No files yet · Tap Add Files')+'</div>'}function openFile(x){let url=URL.createObjectURL(x.file),p=$('preview'),n=x.name;let body=/\.(png|jpg|jpeg|webp|gif)$/i.test(n)?'<img src="'+url+'">':/\.(mp4|webm)$/i.test(n)?'<video controls src="'+url+'"></video>':/\.(mp3|wav|ogg)$/i.test(n)?'<audio controls src="'+url+'"></audio>':/\.pdf$/i.test(n)?'<iframe style="height:72vh" src="'+url+'"></iframe>':'<p>Preview not available for this format.</p>';p.innerHTML='<div class="top"><button class="pill" onclick="closePreview()">‹ Done</button><button class="pill" onclick="shareFile()">↥ Share</button></div><h2>'+esc(n)+'</h2>'+body+'<div class="toolbar"><button class="pill" onclick="renameFile()">Rename</button><button class="pill" onclick="deleteFile()">Delete</button><button class="pill" onclick="downloadFile()">Save</button></div>';p.classList.remove('hidden');window.activeFile=x;window.activeURL=url}function closePreview(){$('preview').classList.add('hidden');URL.revokeObjectURL(window.activeURL);render()}function renameFile(){let n=prompt('Rename',activeFile.name);if(n){activeFile.name=n;closePreview()}}function deleteFile(){if(confirm('Delete this file from the app list?')){entries=entries.filter(x=>x!==activeFile);closePreview()}}function downloadFile(){let a=document.createElement('a');a.href=activeURL;a.download=activeFile.name;a.click()}async function shareFile(){try{if(navigator.canShare&&navigator.canShare({files:[activeFile.file]}))await navigator.share({files:[activeFile.file]});else downloadFile()}catch(e){}}render();</script></body></html>
